# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
# GitHub Actions — MLflow Retraining + Docker Build + Push to Docker Hub
# Dicoding Submission: Membangun Sistem Machine Learning (Tier Advance — Kriteria 3)
# ──────────────────────────────────────────────────────────────────────────────

name: MLflow Retraining & Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain-and-build:
    name: Retrain Model & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── Memaksa Runner Menggunakan Node.js 24 Sesuai Regulasi Terbaru ──
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ── Docker ────────────────────────────────────────────────────────────
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-prediction
      IMAGE_TAG:  ${{ github.sha }}

    steps:
      # ── 1. Checkout Kode ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Miniconda ──────────────────────────────────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10.14"
          auto-update-conda: false
          channels: "conda-forge,defaults"
          activate-environment: "base"

      # ── 3. Install MLflow & DagsHub di base environment ────────────────────
      - name: Install MLflow and DagsHub
        shell: bash -el {0}
        run: pip install mlflow==2.19.0 dagshub==0.3.25

      # ── 4. Jalankan Retraining via `mlflow run` (Oper Token via Parameter Proyek) ──
      - name: Run MLflow Project (Retraining)
        shell: bash -el {0}
        run: |
          cd MLProject
          mlflow run . \
            --env-manager conda \
            -P dagshub-repo-owner=${{ secrets.DAGSHUB_USERNAME }} \
            -P dagshub-repo-name=Workflow-CI \
            -P data=diabetes_prediction_preprocessing.csv \
            -P dagshub-token=${{ secrets.DAGSHUB_TOKEN }}

      # ── 5. Baca Model URI dari file output training ─────────────────────────
      - name: Read model URI
        id: model_info
        shell: bash -el {0}
        run: |
          MODEL_URI=$(cat MLProject/model_uri.txt)
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "model_uri=$MODEL_URI" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID"       >> "$GITHUB_OUTPUT"
          echo "Model URI : $MODEL_URI"
          echo "Run ID    : $RUN_ID"

      # ── 6. Setup Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 7. Login ke Docker Hub ──────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 8. Build Docker Image dari MLflow Model ────────────────────────────
      - name: Build Docker image from MLflow model
        shell: bash -el {0}
        run: |
          cd MLProject
          mlflow models build-docker \
            --model-uri ${{ steps.model_info.outputs.model_uri }} \
            --name ${{ env.IMAGE_NAME }}

      # ── 9. Tag Image dengan SHA dan latest ────────────────────────────────
      - name: Tag Docker image
        shell: bash -el {0}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ── 10. Push ke Docker Hub ─────────────────────────────────────────────
      - name: Push Docker image to Docker Hub
        shell: bash -el {0}
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "🚀 Image berhasil di-push ke Docker Hub!"

      # ── 11. Upload Metadata sebagai Artifact CI ────────────────────────────
      - name: Upload training metadata as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-metadata
          path: |
            MLProject/run_id.txt
            MLProject/model_uri.txt
          retention-days: 30